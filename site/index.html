<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DES112 Project</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Bouncy buttons</h1>
    <p>Click each button to see how it moves.</p>

    <div class="gallery">
      <button class="bouncy bounce">Bounce</button>
      <button class="bouncy squish">Squish</button>
      <button class="bouncy jelly">Jelly</button>
      <button class="bouncy pop">Pop</button>
      <button class="bouncy spring">Spring</button>
    </div>

    <div class="gallery">
      <button class="bouncy outline bounce">Bounce</button>
      <button class="bouncy outline squish">Squish</button>
      <button class="bouncy outline jelly">Jelly</button>
      <button class="bouncy outline pop">Pop</button>
      <button class="bouncy outline spring">Spring</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
